name: Reusable .NET Package CI

on:
  workflow_call:
    inputs:
      solution:
        description: Path to the solution file.
        required: true
        type: string
      test-project:
        description: Path to the test project.
        required: true
        type: string
      package-project:
        description: Path to the package project.
        required: true
        type: string
      pack-style:
        description: Pack behavior. Use package for built libraries and template for template packages.
        required: false
        type: string
        default: package
      coverage-min:
        description: Legacy minimum line coverage percentage. Use coverage-line-min for new callers.
        required: false
        type: number
        default: 0
      coverage-line-min:
        description: Minimum required line coverage percentage when fail-on-coverage is true. Use 0 to skip the line gate.
        required: false
        type: number
        default: 0
      coverage-branch-min:
        description: Minimum required branch coverage percentage when fail-on-coverage is true. Use 0 to skip the branch gate.
        required: false
        type: number
        default: 0
      fail-on-coverage:
        description: Fail the build when enabled coverage thresholds are not met.
        required: false
        type: boolean
        default: false
      publish-coverage-report:
        description: Generate and publish HTML, Markdown, Cobertura, and badge coverage reports.
        required: false
        type: boolean
        default: true
      runners:
        description: JSON array of GitHub-hosted runners.
        required: false
        type: string
        default: '["ubuntu-latest","windows-latest"]'
      allow-empty-coverage:
        description: Allow a coverage report with no measurable lines.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip
  SOLUTION_FILE: ${{ inputs.solution }}
  TEST_PROJECT: ${{ inputs.test-project }}
  PACKAGE_PROJECT: ${{ inputs.package-project }}
  PACK_STYLE: ${{ inputs.pack-style }}

jobs:
  release-source:
    name: release-source
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require development as the release source
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$HEAD_REF" != "development" ]]; then
            echo "::error::Pull requests to master must come from development."
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    permissions:
      contents: read
      checks: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # MinVer needs full git history

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}" --verbosity minimal --locked-mode -p:RestoreLockedMode=true

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format "${{ env.SOLUTION_FILE }}" --verify-no-changes --verbosity minimal --no-restore

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration Release --no-restore --verbosity minimal

      - name: Write coverage settings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <DataCollectionRunSettings>
              <DataCollectors>
                <DataCollector friendlyName="XPlat Code Coverage">
                  <Configuration>
                    <Format>cobertura</Format>
                    <SkipAutoProps>true</SkipAutoProps>
                    <ExcludeByAttribute>Obsolete,GeneratedCodeAttribute,CompilerGeneratedAttribute,ExcludeFromCodeCoverageAttribute</ExcludeByAttribute>
                    <ExcludeByFile>**/*.g.cs,**/*.Designer.cs</ExcludeByFile>
                  </Configuration>
                </DataCollector>
              </DataCollectors>
            </DataCollectionRunSettings>
          </RunSettings>
          '@ | Set-Content -Path artifacts/coverage.runsettings -Encoding UTF8

      - name: Test
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --settings artifacts/coverage.runsettings --collect "XPlat Code Coverage" --results-directory artifacts/test-results --verbosity minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Publish test results
        if: always() && matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: .NET test results
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Detect coverage reports
        id: coverage-files
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path artifacts/test-results -Recurse -Filter coverage.cobertura.xml -File -ErrorAction SilentlyContinue)

          if ($reports.Count -eq 0) {
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Warning "No Cobertura coverage reports were found."
            exit 0
          }

          "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $reports | ForEach-Object { Write-Host "Found coverage report: $($_.FullName)" }

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && steps.coverage-files.outputs.found == 'true' && (inputs.publish-coverage-report == true || inputs.fail-on-coverage == true)
        uses: danielpalme/ReportGenerator-GitHub-Action@049f7ec958c672fd31d5cc1cb01622dc8d2e23ab # 5.5.10
        with:
          reports: artifacts/test-results/**/coverage.cobertura.xml
          targetdir: artifacts/coverage-report
          reporttypes: Html;MarkdownSummaryGithub;Cobertura;Badges

      - name: Enforce coverage threshold
        if: matrix.os == 'ubuntu-latest' && inputs.fail-on-coverage == true
        env:
          ALLOW_EMPTY_COVERAGE: ${{ inputs.allow-empty-coverage }}
          COVERAGE_BRANCH_MIN: ${{ inputs.coverage-branch-min }}
          COVERAGE_LEGACY_MIN: ${{ inputs.coverage-min }}
          COVERAGE_LINE_MIN: ${{ inputs.coverage-line-min }}
        shell: pwsh
        run: |
          $reportPath = 'artifacts/coverage-report/Cobertura.xml'
          if (-not (Test-Path -LiteralPath $reportPath)) {
            throw "Coverage gate is enabled, but no merged Cobertura report was generated."
          }

          $invariantCulture = [Globalization.CultureInfo]::InvariantCulture

          function Read-DoubleInput([string]$value, [string]$name) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              return 0.0
            }

            $result = [double]::Parse($value, $invariantCulture)
            if ($result -lt 0 -or $result -gt 100) {
              throw "$name must be between 0 and 100."
            }

            return $result
          }

          function Read-RequiredDoubleAttribute([xml]$coverageDocument, [string]$name) {
            $value = $coverageDocument.DocumentElement.GetAttribute($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Invalid Cobertura report: missing '$name'."
            }

            return [double]::Parse($value, $invariantCulture)
          }

          function Read-RequiredIntAttribute([xml]$coverageDocument, [string]$name) {
            $value = $coverageDocument.DocumentElement.GetAttribute($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Invalid Cobertura report: missing '$name'."
            }

            return [int]::Parse($value, $invariantCulture)
          }

          [xml]$coverage = Get-Content -Raw -LiteralPath $reportPath
          $coverageElement = $coverage.DocumentElement

          if ($null -eq $coverageElement -or $coverageElement.LocalName -ne 'coverage') {
            throw "Invalid Cobertura report: expected a coverage root element."
          }

          $linesValid = Read-RequiredIntAttribute $coverage 'lines-valid'

          if ($linesValid -eq 0) {
            if ($env:ALLOW_EMPTY_COVERAGE -eq 'true') {
              Write-Warning "Coverage not measurable because the report contains no valid lines; explicitly allowed."
              exit 0
            }

            throw "Coverage not measurable: the report contains no valid lines."
          }

          $lineMinimum = Read-DoubleInput $env:COVERAGE_LINE_MIN 'coverage-line-min'
          $legacyMinimum = Read-DoubleInput $env:COVERAGE_LEGACY_MIN 'coverage-min'
          $branchMinimum = Read-DoubleInput $env:COVERAGE_BRANCH_MIN 'coverage-branch-min'

          if ($lineMinimum -eq 0 -and $legacyMinimum -gt 0) {
            $lineMinimum = $legacyMinimum
          }

          $lineRate = Read-RequiredDoubleAttribute $coverage 'line-rate'
          $branchRate = Read-RequiredDoubleAttribute $coverage 'branch-rate'
          $lineCoverage = [math]::Round($lineRate * 100, 2)
          $branchCoverage = [math]::Round($branchRate * 100, 2)

          if ($lineMinimum -gt 0 -and $lineCoverage -lt $lineMinimum) {
            throw "Line coverage is $lineCoverage%; required minimum is $lineMinimum%."
          }

          if ($branchMinimum -gt 0 -and $branchCoverage -lt $branchMinimum) {
            throw "Branch coverage is $branchCoverage%; required minimum is $branchMinimum%."
          }

          if ($lineMinimum -gt 0) {
            Write-Host "Line coverage is $lineCoverage%; required minimum is $lineMinimum%."
          } else {
            Write-Host "Line coverage is $lineCoverage%; no minimum configured."
          }

          if ($branchMinimum -gt 0) {
            Write-Host "Branch coverage is $branchCoverage%; required minimum is $branchMinimum%."
          } else {
            Write-Host "Branch coverage is $branchCoverage%; no minimum configured."
          }

      - name: Publish coverage summary
        if: matrix.os == 'ubuntu-latest' && inputs.publish-coverage-report == true && steps.coverage-files.outputs.found == 'true'
        shell: bash
        run: |
          if [[ -f artifacts/coverage-report/SummaryGithub.md ]]; then
            cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && inputs.publish-coverage-report == true && steps.coverage-files.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: artifacts/coverage-report
          if-no-files-found: warn

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $packageProject = $env:PACKAGE_PROJECT

          switch ($env:PACK_STYLE) {
            'package' {
              dotnet pack "$packageProject" --configuration Release --no-build --output artifacts/packages --verbosity minimal -p:EnablePackageValidation=true
              break
            }
            'template' {
              dotnet restore "$packageProject" --verbosity minimal --locked-mode -p:RestoreLockedMode=true
              dotnet pack "$packageProject" --configuration Release --no-restore --output artifacts/packages --verbosity minimal -p:EnablePackageValidation=true
              break
            }
            default {
              throw "Unsupported pack-style '$env:PACK_STYLE'. Use 'package' or 'template'."
            }
          }

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
